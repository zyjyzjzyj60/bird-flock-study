<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.svg" />
    <title>向风成群 · 鸟群实验</title>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="back-link" href="https://github.com/zyjyzjzyj60/bird-flock-study" aria-label="查看鸟群实验源代码"><span>查看源代码 ↗</span></a>
        <span class="topbar-note">BIRD FLOCK / STUDY</span>
      </header>

      <main>
        <div class="introduction">
          <div>
            <p class="eyebrow">三条规则，一片天空</p>
            <h1>向风成群<span>。</span></h1>
          </div>
          <p class="intro-copy">每只鸟只观察附近的同伴：保持距离，跟随方向，回到群体。用鼠标或触屏模拟天敌，看看它们怎样躲避。</p>
        </div>

        <section class="control-panel" aria-labelledby="controls-title">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">调整它们的关系</p>
              <h2 id="controls-title">群飞规则</h2>
            </div>
            <div class="playback-controls">
              <button id="play-button" type="button" aria-pressed="false">暂停</button>
              <button id="reset-button" type="button">重置鸟群</button>
            </div>
          </div>
          <div class="rule-grid">
            <label class="rule" for="separation-range">
              <span class="rule-header"><strong>分离</strong><output id="separation-value" for="separation-range">1.8</output></span>
              <span class="rule-description">靠得太近，就向彼此留出空间。</span>
              <input id="separation-range" type="range" min="0" max="2.5" step="0.1" value="1.8" />
            </label>
            <label class="rule" for="alignment-range">
              <span class="rule-header"><strong>对齐</strong><output id="alignment-value" for="alignment-range">1.0</output></span>
              <span class="rule-description">让方向与速度接近周围的鸟。</span>
              <input id="alignment-range" type="range" min="0" max="2.5" step="0.1" value="1.0" />
            </label>
            <label class="rule" for="cohesion-range">
              <span class="rule-header"><strong>聚合</strong><output id="cohesion-value" for="cohesion-range">0.8</output></span>
              <span class="rule-description">朝附近同伴的中心转向。</span>
              <input id="cohesion-range" type="range" min="0" max="2.5" step="0.1" value="0.8" />
            </label>
          </div>
          <p class="touch-hint">触屏按住画布可驱赶鸟群；从两侧留白滑动可上下浏览。</p>
          <p class="interaction-note" id="simulation-status" role="status">鸟群正在飞行 · 鼠标进入天空可模拟天敌，触屏请按住拖动。</p>
        </section>
        <section class="sky-frame" id="flock-stage" role="img" aria-label="鸟群飞行画布。鼠标进入或触屏按住时，附近鸟会避开天敌范围。">
          <div class="sky-caption" aria-hidden="true"><span id="bird-count">— 只飞鸟</span><span id="fps-value">— FPS</span></div>
          <span class="sky-corner sky-corner-top" aria-hidden="true"></span>
          <span class="sky-corner sky-corner-bottom" aria-hidden="true"></span>
        </section>

      </main>

      <footer class="page-footer"><span>BOIDS / SEPARATION · ALIGNMENT · COHESION</span><span>无需摄像头 · 本地运行</span></footer>
    </div>
    <script type="module" src="/src/birds/main.ts"></script>
  </body>
</html>
